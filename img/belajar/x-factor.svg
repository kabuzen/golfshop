<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 545" role="img" aria-label="Diagram X-factor bahu dan pinggul"><rect width="600" height="545" rx="18" fill="#f7faf9"/><text x="300" y="40" text-anchor="middle" style="font-family:Inter,Arial,sans-serif;font-size:20px;font-weight:800" fill="#14243a">X-Factor: Selisih Putaran Bahu dan Pinggul</text><circle cx="300" cy="250" r="150" fill="#fff" stroke="#e2e8f0"/><line x1="160.0" y1="250.0" x2="440.0" y2="250.0" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/><line x1="222.2" y1="172.2" x2="377.8" y2="327.8" stroke="#f5b301" stroke-width="16" stroke-linecap="round"/><line x1="300.0" y1="115.0" x2="300.0" y2="385.0" stroke="#087b4d" stroke-width="16" stroke-linecap="round"/><path d="M 349.5 200.5 A 70 70 0 0 0 300.0 180" fill="none" stroke="#dc2626" stroke-width="3"/><text x="352" y="172" text-anchor="start" style="font-family:Inter,Arial,sans-serif;font-size:14px;font-weight:800" fill="#dc2626">≈45° X-factor</text><circle cx="300" cy="250" r="10" fill="#14243a"/><rect x="40" y="430" width="16" height="16" rx="3" fill="#087b4d"/><text x="64" y="443" text-anchor="start" style="font-family:Inter,Arial,sans-serif;font-size:13px;font-weight:600" fill="#14243a">Garis bahu (≈90° di puncak backswing)</text><rect x="40" y="456" width="16" height="16" rx="3" fill="#f5b301"/><text x="64" y="469" text-anchor="start" style="font-family:Inter,Arial,sans-serif;font-size:13px;font-weight:600" fill="#14243a">Garis pinggul (≈45°)</text><rect x="40" y="482" width="16" height="4" fill="#cbd5e1"/><text x="64" y="490" text-anchor="start" style="font-family:Inter,Arial,sans-serif;font-size:13px;font-weight:600" fill="#14243a">Posisi awal saat address (sejajar garis target)</text><text x="300" y="525" text-anchor="middle" style="font-family:Inter,Arial,sans-serif;font-size:12px;font-weight:500" fill="#64748b">Angka sudut hanya ilustrasi umum; besarnya berbeda tiap pemain.</text></svg>