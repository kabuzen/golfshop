<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 488" role="img" aria-label="Posisi bola dan lebar kaki per stick"><rect width="900" height="488" rx="18" fill="#f7faf9"/><text x="450" y="40" text-anchor="middle" style="font-family:Inter,Arial,sans-serif;font-size:20px;font-weight:800" fill="#14243a">Posisi Bola &amp; Lebar Kaki per Stick (tampak atas, pemain tangan kanan)</text><rect x="20" y="60" width="860" height="78" rx="12" fill="#fff" stroke="#d7e6dd"/><text x="40" y="84" text-anchor="start" style="font-family:Inter,Arial,sans-serif;font-size:16px;font-weight:700" fill="#14243a">Driver</text><text x="40" y="108" text-anchor="start" style="font-family:Inter,Arial,sans-serif;font-size:13px;font-weight:500" fill="#475569">Sejajar tumit kaki kiri</text><line x1="250" y1="120" x2="860" y2="120" stroke="#cbd5e1" stroke-dasharray="6 6"/><rect x="351" y="66" width="28" height="44" rx="12" fill="#14243a" opacity=".85"/><rect x="581" y="66" width="28" height="44" rx="12" fill="#14243a" opacity=".85"/><circle cx="589" cy="120" r="9" fill="#fff" stroke="#087b4d" stroke-width="3"/><text x="655" y="92" text-anchor="start" style="font-family:Inter,Arial,sans-serif;font-size:12px;font-weight:700" fill="#087b4d">→ arah target</text><rect x="20" y="152" width="860" height="78" rx="12" fill="#fff" stroke="#d7e6dd"/><text x="40" y="176" text-anchor="start" style="font-family:Inter,Arial,sans-serif;font-size:16px;font-weight:700" fill="#14243a">Fairway wood / Hybrid</text><text x="40" y="200" text-anchor="start" style="font-family:Inter,Arial,sans-serif;font-size:13px;font-weight:500" fill="#475569">1–2 bola di dalam tumit kiri</text><line x1="250" y1="212" x2="860" y2="212" stroke="#cbd5e1" stroke-dasharray="6 6"/><rect x="366" y="158" width="28" height="44" rx="12" fill="#14243a" opacity=".85"/><rect x="566" y="158" width="28" height="44" rx="12" fill="#14243a" opacity=".85"/><circle cx="540" cy="212" r="9" fill="#fff" stroke="#087b4d" stroke-width="3"/><rect x="20" y="244" width="860" height="78" rx="12" fill="#fff" stroke="#d7e6dd"/><text x="40" y="268" text-anchor="start" style="font-family:Inter,Arial,sans-serif;font-size:16px;font-weight:700" fill="#14243a">Iron 5–7</text><text x="40" y="292" text-anchor="start" style="font-family:Inter,Arial,sans-serif;font-size:13px;font-weight:500" fill="#475569">Sedikit di depan tengah</text><line x1="250" y1="304" x2="860" y2="304" stroke="#cbd5e1" stroke-dasharray="6 6"/><rect x="381" y="250" width="28" height="44" rx="12" fill="#14243a" opacity=".85"/><rect x="551" y="250" width="28" height="44" rx="12" fill="#14243a" opacity=".85"/><circle cx="498.0" cy="304" r="9" fill="#fff" stroke="#087b4d" stroke-width="3"/><rect x="20" y="336" width="860" height="78" rx="12" fill="#fff" stroke="#d7e6dd"/><text x="40" y="360" text-anchor="start" style="font-family:Inter,Arial,sans-serif;font-size:16px;font-weight:700" fill="#14243a">Iron 8–9 / Wedge</text><text x="40" y="384" text-anchor="start" style="font-family:Inter,Arial,sans-serif;font-size:13px;font-weight:500" fill="#475569">Tengah stance</text><line x1="250" y1="396" x2="860" y2="396" stroke="#cbd5e1" stroke-dasharray="6 6"/><rect x="396" y="342" width="28" height="44" rx="12" fill="#14243a" opacity=".85"/><rect x="536" y="342" width="28" height="44" rx="12" fill="#14243a" opacity=".85"/><circle cx="480.0" cy="396" r="9" fill="#fff" stroke="#087b4d" stroke-width="3"/><text x="450" y="464" text-anchor="middle" style="font-family:Inter,Arial,sans-serif;font-size:13px;font-weight:500" fill="#475569">Kaki kanan = belakang, kaki kiri = depan (arah target). Semakin panjang stick, semakin lebar kaki dan semakin maju posisi bola.</text></svg>